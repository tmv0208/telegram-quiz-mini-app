<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Mini App Test</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, sans-serif;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }

    button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border: 0;
      border-radius: 12px;
      background: var(--tg-theme-button-color, #3390ec);
      color: var(--tg-theme-button-text-color, #fff);
      font-size: 16px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(0, 0, 0, 0.05);
      padding: 12px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h2>Mini App Test</h2>

  <pre id="debug">Загрузка...</pre>

  <button type="button" id="sendBtn">
    Отправить тестовый результат
  </button>

  <pre id="status"></pre>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    const debug = document.getElementById("debug");
    const status = document.getElementById("status");
    const sendBtn = document.getElementById("sendBtn");

    debug.textContent = [
      "Telegram available: " + (!!window.Telegram),
      "WebApp available: " + (!!tg),
      "sendData available: " + (!!(tg && typeof tg.sendData === "function")),
      "start_param: " + ((tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "null"),
      "location.search: " + (window.location.search || "empty")
    ].join("\n");

    sendBtn.addEventListener("click", () => {
      status.textContent = "";

      if (!tg || typeof tg.sendData !== "function") {
        status.textContent = "Ошибка: страница открыта не как Telegram Mini App.";
        return;
      }

      const testData = {
        quiz_id: "main",
        score: 1,
        total: 1,
        finished_at: new Date().toISOString()
      };

      try {
        tg.sendData(JSON.stringify(testData));
        status.textContent = "Тестовый результат отправлен. Закрываю Mini App...";

        setTimeout(() => {
          tg.close();
        }, 800);

      } catch (error) {
        status.textContent = "Ошибка sendData: " + error.message;
      }
    });
  </script>
</body>
</html>
